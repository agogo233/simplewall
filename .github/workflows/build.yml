name: Build simplewall

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone submodules
        shell: bash
        run: |
          git clone https://github.com/henrypp/routine.git ../routine
          # the pinned revision is the same source as a5479438, which upstream
          # dropped from the history when it rewrote it, so fall back to
          # fetching it by revision
          git -C ../routine checkout 6e6888c3ffca5324a2865524f03533ff8dee7ddf || {
            git -C ../routine fetch origin 6e6888c3ffca5324a2865524f03533ff8dee7ddf
            git -C ../routine checkout FETCH_HEAD
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Restore NuGet packages
        run: nuget restore simplewall.sln

      - name: Build x64 Release
        run: msbuild simplewall.sln /p:Configuration=Release /p:Platform=x64

      - name: Build locale
        run: python build_locale.py --name-short=simplewall

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload\x64
          Copy-Item bin\64\simplewall.exe upload\x64\
          Copy-Item bin\64\simplewall.pdb upload\x64\
          Copy-Item bin\simplewall.lng upload\x64\
          Copy-Item bin\Readme.txt upload\x64\
          Copy-Item bin\License.txt upload\x64\
          Copy-Item bin\History.txt upload\x64\
          Copy-Item bin\profile_internal.xml upload\x64\
          Copy-Item -Recurse bin\i18n upload\x64\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: simplewall-x64
          path: upload/x64/
